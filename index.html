<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏃 运动冒险</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:24px;font-weight:900}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill,.xp{background:#fff;padding:9px 13px;border-radius:14px;font-weight:900;box-shadow:0 8px 24px #26323812}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:#fff;border:1px solid #e7ebf1;border-radius:22px;padding:20px;box-shadow:0 8px 24px #2632380d;margin-bottom:18px}.hero{padding:0;overflow:hidden;background:#fff}.herohead{padding:20px}.muted{font-size:12px;color:#748091}.levelrow{display:flex;justify-content:space-between;align-items:end}.level{font-size:21px;font-weight:900}.today{font-size:42px;font-weight:900}.progress{height:11px;background:#e8eee5;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#58cc02;border-radius:99px}.scene{height:300px;position:relative;background:linear-gradient(#eaffd8 0 68%,#dff3c9 68%);display:flex;justify-content:center;align-items:center;overflow:hidden}.sun{position:absolute;width:80px;height:80px;border-radius:50%;background:#fff1a8;right:12%;top:30px}.cloud{position:absolute;width:95px;height:28px;background:#fff;border-radius:30px;left:10%;top:55px}.ground{position:absolute;width:220px;height:15px;border-radius:50%;background:#b7dc91;bottom:38px}.person{position:relative;width:150px;height:230px;z-index:2}.head{position:absolute;width:78px;height:78px;left:36px;top:22px;border:4px solid #263238;border-radius:50%;background:#fff}.eye{position:absolute;width:7px;height:10px;background:#263238;border-radius:50%;top:53px}.eye1{left:57px}.eye2{left:83px}.mouth{position:absolute;width:18px;height:10px;left:59px;top:71px;border-bottom:3px solid #263238;border-radius:0 0 20px 20px}.body{position:absolute;width:10px;height:76px;left:70px;top:96px;background:#263238;border-radius:8px}.arm,.leg{position:absolute;width:9px;background:#263238;border-radius:8px;transform-origin:top center}.arm{height:63px;top:103px}.arm1{left:67px;transform:rotate(28deg)}.arm2{left:75px;transform:rotate(-28deg)}.leg{height:74px;top:160px}.leg1{left:67px;transform:rotate(20deg)}.leg2{left:75px;transform:rotate(-20deg)}.equip{display:none;position:absolute;z-index:5}.hat{width:94px;height:31px;left:28px;top:8px;background:#58cc02;border:4px solid #263238;border-radius:50px 50px 8px 8px}.hat:after{content:"";position:absolute;width:60px;height:9px;left:13px;bottom:-8px;background:#263238;border-radius:50%}.bow{width:40px;height:30px;left:15px;top:48px}.bow:before,.bow:after{content:"";position:absolute;width:21px;height:24px;background:#b9adff;border:4px solid #8066e8;border-radius:80% 20% 80% 20%}.bow:after{left:15px;transform:scaleX(-1)}.shoes{width:76px;height:18px;left:37px;top:215px}.shoes:before,.shoes:after{content:"";position:absolute;width:32px;height:14px;background:#ffc800;border:4px solid #263238;border-radius:12px}.shoes:after{right:0}.glasses{width:66px;height:22px;left:42px;top:48px}.glasses:before,.glasses:after{content:"";position:absolute;width:23px;height:16px;border:3px solid #263238;border-radius:8px;background:#cceeffaa}.glasses:after{right:0}.cape{width:62px;height:78px;left:79px;top:101px;background:#8066e8;border:4px solid #263238;border-radius:8px 30px 30px 8px;transform:skewY(8deg)}.spark{position:absolute;font-size:24px;animation:f 2s ease-in-out infinite}.s1{left:20%;top:120px}.s2{right:20%;top:150px}.s3{right:28%;top:78px}@keyframes f{50%{transform:translateY(-8px)}}.name{text-align:center;font-weight:900;padding:13px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#58cc02;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#eef2f6;color:#40505e}.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{border:1px solid #e2e7ed;background:#f7f9fc;border-radius:13px;padding:9px;cursor:pointer;text-align:center}.item.locked{opacity:.4;cursor:default}.item.on{background:#fff4c9;border-color:#e7c34e}.item span{font-size:24px;display:block}.item small{font-size:10px;color:#748091}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.node{text-align:center;padding:10px;background:#f7f9fc;border-radius:14px;border:1px solid #e5e9ef}.node.done{background:#eaffd8;border-color:#bce990}.node span{font-size:25px;display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:13px;font-weight:800}.full{grid-column:1/-1}.form input,.form textarea{width:100%;margin-top:5px;padding:10px;border:1px solid #dce2ea;border-radius:10px}.form textarea{min-height:70px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border-radius:13px;padding:12px}.stat b{display:block;font-size:21px}.history{padding:10px 0;border-bottom:1px solid #e7ebf1}.surprise{background:#fff7df;border:1px dashed #e3bd4c;border-radius:14px;padding:13px}.backup{margin-top:12px;display:flex;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:45px;border:1px solid #e5e9ef;background:#fff;border-radius:9px}.day.done{background:#eaffd8}.toast{position:fixed;right:18px;bottom:18px;background:#263238;color:#fff;padding:13px 16px;border-radius:13px;display:none;z-index:10}.toast.show{display:block}.modal{position:fixed;inset:0;background:#26323866;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:22px;padding:28px;text-align:center;max-width:390px;margin:20px}.modalbox .ico{font-size:52px}@media(max-width:800px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><header class="top"><div class="brand">🏃 运动冒险</div><div class="pills"><span class="pill">🏅 <b id="rank">初出发</b></span><span class="xp">⭐ <b id="xp">0</b> XP</span><span class="pill">🔥 <b id="streak">0</b> 天</span></div></header><div class="grid"><main><section class="card hero"><div class="herohead"><div class="muted">你的运动伙伴</div><div class="levelrow"><div><div class="level">Lv.<span id="level">1</span> · <span id="title">初出发</span></div><div class="muted" id="next"></div></div><div class="today"><span id="today">0</span><small> 分钟</small></div></div><div class="progress"><i id="bar"></i></div><div class="muted"><span id="start">0</span> XP → <span id="end">100</span> XP</div></div><div class="scene"><div class="sun"></div><div class="cloud"></div><div class="ground"></div><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">·</span><div class="person"><div id="hat" class="equip hat"></div><div id="bow" class="equip bow"></div><div id="glasses" class="equip glasses"></div><div id="cape" class="equip cape"></div><div class="head"></div><div class="eye eye1"></div><div class="eye eye2"></div><div class="mouth"></div><div class="body"></div><div class="arm arm1"></div><div class="arm arm2"></div><div class="leg leg1"></div><div class="leg leg2"></div><div id="shoes" class="equip shoes"></div></div></div><div class="name">小运动员 · <span id="mood">等你一起出发</span></div></section><section class="card"><h2>🧢 给小人换装</h2><div class="muted">运动累计 XP 会发现新装备，解锁后可以自由装备。</div><div class="wardrobe" id="wardrobe" style="margin-top:10px"></div></section><section class="card"><h2>🗺️ 冒险地图</h2><div class="map" id="map"></div><div class="muted" style="margin-top:10px">运动让你向前走；休息不会让你倒退。</div></section><section class="card"><h2>📝 记录运动</h2><div class="form"><label>日期<input id="date" type="date"></label><label>时长（分钟）<input id="minutes" type="number" min="1"></label><label class="full">做了什么？<input id="exercise"></label><label class="full">Bilibili 视频链接（可选）<input id="video" type="url"></label><label class="full">今天的感受（可选）<textarea id="note"></textarea></label></div><button class="btn" style="margin-top:12px" onclick="saveEntry()">完成冒险并获得 XP ✨</button></section><section class="card"><h2>📅 运动脚印</h2><div class="calendar" id="calendar"></div></section></main><aside><section class="card"><h2>🎲 今日惊喜</h2><div class="surprise"><b id="surpriseTitle">随机事件</b><p class="muted" id="surpriseText">打开看看今天遇到什么。</p><button class="btn gray" onclick="surprise()">打开惊喜</button></div></section><section class="card"><h2>🎒 收藏与解锁</h2><div id="badges"></div></section><section class="card"><h2>📊 数据</h2><div class="stats"><div class="stat"><b id="week">0</b><span>本周分钟</span></div><div class="stat"><b id="month">0</b><span>本月分钟</span></div><div class="stat"><b id="sessions">0</b><span>总次数</span></div></div></section><section class="card"><h2>📜 最近冒险</h2><div id="history"></div></section><section class="card"><h2>🛡️ 数据保护</h2><div class="muted">记录保存在浏览器中，每次保存自动备份。</div><div class="backup"><button class="btn gray" onclick="exportData()">导出备份</button><button class="btn gray" onclick="file.click()">导入备份</button><input id="file" type="file" accept="application/json" hidden onchange="importData(event)"></div><div class="muted" id="status" style="margin-top:8px"></div></section></aside></div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><div class="ico" id="modalIco">🎉</div><h2 id="modalTitle">升级啦！</h2><p id="modalText"></p><button class="btn" onclick="closeModal()">继续冒险</button></div></div>
<script>
const $=id=>document.getElementById(id),KEY='exerciseDiaryV1',BACKUP='exerciseDiaryBackupV1';
const today=()=>new Date().toISOString().slice(0,10);
function read(k){try{let d=JSON.parse(localStorage.getItem(k)||'null');return d&&Array.isArray(d.entries)?{entries:d.entries,xp:Number(d.xp)||0,missions:d.missions||{},avatar:d.avatar||{}}:null}catch(e){return null}}
let data=read(KEY)||read(BACKUP)||{entries:[],xp:0,missions:{},avatar:{}};
function save(){let s=JSON.stringify(data);localStorage.setItem(KEY,s);localStorage.setItem(BACKUP,s)}
const titles=['初出发','小小冒险者','活力学徒','运动探索者','活力冒险家','森林守护者','山路行者','星光旅人','传奇冒险家'],T=[0,100,250,400,550,700,850,1000,1150];
const places=[['🌱','新手村',0],['🌳','森林小径',100],['🌊','清风湖畔',250],['⛰️','云端山路',400],['🏰','未知城堡',550],['🌌','星光秘境',700],['🌋','勇者火山',850],['🌈','彩虹终点',1000],['👑','冒险王座',1150]],items=[['hat','🧢','活力帽',60],['bow','🎀','小蝴蝶结',120],['shoes','👟','运动鞋',200],['glasses','🤓','酷酷眼镜',350],['cape','🦸','小披风',550]];
function level(x=data.xp){let l=1;for(let i=1;i<T.length;i++)if(x>=T[i])l=i+1;return l}
function mins(d){return data.entries.filter(e=>e.date===d).reduce((a,e)=>a+Number(e.minutes||0),0)}function allM(){return data.entries.reduce((a,e)=>a+Number(e.minutes||0),0)}
function streak(){let ds=[...new Set(data.entries.map(e=>e.date))].sort().reverse();if(!ds.length)return 0;let d=new Date(today()+'T00:00:00');if(ds[0]!==today()){d.setDate(d.getDate()-1);if(ds[0]!==d.toISOString().slice(0,10))return 0}let n=0;for(let s of ds){if(s!==d.toISOString().slice(0,10))break;n++;d.setDate(d.getDate()-1)}return n}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}
function saveEntry(){let d=$('date').value,m=Number($('minutes').value),x=$('exercise').value.trim();if(!d||m<1||!x){toast('请填写日期、时长和运动内容');return}let old=data.xp;data.entries.push({id:Date.now(),date:d,minutes:m,exercise:x,video:$('video').value.trim(),note:$('note').value.trim()});data.xp+=Math.min(100,10+Math.round(m/5)*2);save();$('minutes').value='';$('exercise').value='';$('video').value='';$('note').value='';render();if(level(old)<level()){$('modalIco').textContent='🎉';$('modalTitle').textContent='升级！ Lv.'+level();$('modalText').textContent='获得新称号「'+titles[level()-1]+'」';$('modal').classList.add('show')}else{let q=items.find(i=>old<i[3]&&data.xp>=i[3]);if(q){$('modalIco').textContent=q[1];$('modalTitle').textContent='发现新装备！';$('modalText').textContent='「'+q[2]+'」已经解锁。';$('modal').classList.add('show')}else toast('完成冒险！ +'+(data.xp-old)+' XP ✨')}}
function equip(id){let q=items.find(i=>i[0]===id);if(!q||data.xp<q[3])return;data.avatar[id]=!data.avatar[id];save();render()}
function renderWardrobe(){$('wardrobe').innerHTML=items.map(i=>{let ok=data.xp>=i[3],on=!!data.avatar[i[0]];return '<button class="item '+(ok?'':'locked')+' '+(on?'on':'')+'" onclick="equip(\''+i[0]+'\')"><span>'+(ok?i[1]:'🔒')+'</span><b>'+i[2]+'</b><small>'+ (ok?(on?'已装备':'点击装备'):'需要 '+i[3]+' XP')+'</small></button>'}).join('')}
function render(){let l=level(),s=T[l-1],n=T[l]||s;$('xp').textContent=data.xp;$('level').textContent=l;$('title').textContent=titles[l-1];$('rank').textContent=titles[l-1];$('start').textContent=s;$('end').textContent=l===T.length?'MAX':n;$('bar').style.width=(l===T.length?100:(data.xp-s)/(n-s)*100)+'%';$('next').textContent=l===T.length?'已抵达最高称号':'距离下一级还有 '+(n-data.xp)+' XP';$('today').textContent=mins(today());$('streak').textContent=streak();items.forEach(i=>$(i[0]).style.display=data.avatar[i[0]]?'block':'none');renderWardrobe();$('map').innerHTML=places.map(p=>'<div class="node '+(data.xp>=p[2]?'done':'')+'"><span>'+p[0]+'</span><b>'+p[1]+'</b><div class="muted">'+(data.xp>=p[2]?'已到达':p[2]+' XP')+'</div></div>').join('');let a=[['🌱','第一次运动',data.entries.length>0],['🔥','连续 3 天',streak()>=3],['⚡','累计 60 分钟',allM()>=60],['🏆','累计 300 分钟',allM()>=300],['🌟','累计 10 次',data.entries.length>=10]];$('badges').innerHTML=a.map(x=>'<span style="display:inline-block;padding:7px;margin:3px;background:'+(x[2]?'#fff0b8':'#f3f6f9')+';border-radius:9px;font-size:12px">'+x[0]+' '+x[1]+(x[2]?' ✓':'')+'</span>').join('');let es=[...data.entries].sort((a,b)=>b.id-a.id);$('history').innerHTML=es.length?es.slice(0,8).map(e=>'<div class="history"><b>'+e.exercise+'</b><div class="muted">'+e.date+' · '+e.minutes+' 分钟'+(e.note?' · '+e.note:'')+'</div></div>').join(''):'<div class="muted">还没有记录。</div>';$('sessions').textContent=data.entries.length;$('month').textContent=data.entries.filter(e=>e.date.startsWith(today().slice(0,7))).reduce((a,e)=>a+Number(e.minutes||0),0);$('week').textContent=data.entries.reduce((a,e)=>a+((new Date(e.date+'T00:00:00')>=new Date(Date.now()-6*86400000))?Number(e.minutes||0):0),0);let d=new Date(today()+'T00:00:00'),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h='';for(let i=0;i<first;i++)h+='<div></div>';for(let j=1;j<=days;j++){let z=y+'-'+String(m+1).padStart(2,'0')+'-'+String(j).padStart(2,'0'),v=mins(z);h+='<button class="day '+(v?'done':'')+'" onclick="date.value=\''+z+'\'">'+j+(v?'<small> 🏃'+v+'m</small>':'')+'</button>'}$('calendar').innerHTML=h;$('status').textContent='当前记录 '+data.entries.length+' 次 · '+allM()+' 分钟 · '+data.xp+' XP · 自动备份正常'}
function surprise(){let a=[['🎁 神秘补给','今天运动后记得喝水。'],['🍀 幸运事件','今天的第一次运动可能发现新装备。'],['🗺️ 探索事件','换一种平时不做的运动，去看看新的风景。'],['✨ 心流事件','如果运动时忘记了时间，恭喜你碰到了心流。'],['🎈 小庆祝','5 分钟也算一次冒险。']];let x=a[Math.floor(Math.random()*a.length)];$('surpriseTitle').textContent=x[0];$('surpriseText').textContent=x[1]}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='exercise-diary-backup.json';a.click();toast('备份已导出')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.entries))throw 0;data={entries:d.entries,xp:Number(d.xp)||0,missions:d.missions||{},avatar:d.avatar||{}};save();render();toast('备份已恢复')}catch(x){toast('备份文件无效')}};r.readAsText(f)}function closeModal(){$('modal').classList.remove('show')}
$('date').value=today();render();
</script></body></html>
