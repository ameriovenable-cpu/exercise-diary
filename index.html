<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>运动冒险 · Exercise Diary</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#263238;--muted:#718096;--green:#58cc02;--green2:#8ee000;--blue:#4b8bf4;--yellow:#ffc800;--pink:#ff7ab6;--line:#e9edf3;--shadow:0 8px 24px rgba(31,41,55,.08)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:24px}.xp{display:flex;gap:10px;align-items:center;background:#fff;padding:9px 14px;border-radius:14px;box-shadow:var(--shadow);font-weight:800}.pill{padding:6px 10px;border-radius:999px;background:#fff4c7}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#eaffd8,#fff);border-color:#d9f4b8}.eyebrow{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{margin:7px 0;font-size:30px}.hero p{color:var(--muted);margin:0 0 18px}.big{font-size:48px;font-weight:900;line-height:1}.btn{background:var(--green);color:#fff;padding:12px 18px;border-radius:13px;font-weight:900;box-shadow:0 3px 0 #45a900}.btn:active{transform:translateY(2px);box-shadow:none}.btn.secondary{background:#eef2f7;color:#425466;box-shadow:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.form label{font-size:13px;font-weight:800;color:#566}.form input,.form textarea{width:100%;padding:11px;border:1px solid #dce2ea;border-radius:12px;background:#fff;margin-top:5px}.form textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{padding:14px;background:#f7f9fc;border-radius:15px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.section{margin-top:18px}.section h2{margin:0 0 12px;font-size:19px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{font-size:11px;text-align:center;color:var(--muted);font-weight:800}.day{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px;text-align:left}.day small{display:block;color:var(--muted)}.day.done{background:#eaffd8;border-color:#b9ed86}.day.selected{outline:3px solid #c8f29c}.day.today{font-weight:900}.badge{display:inline-flex;padding:7px 10px;background:#f4f7fb;border-radius:10px;margin:3px;font-size:13px}.badge.on{background:#fff0b8}.chart{height:150px;display:flex;align-items:end;gap:5px;border-bottom:1px solid var(--line);padding:10px 0 0}.bar{flex:1;min-width:3px;background:linear-gradient(#8ee000,#58cc02);border-radius:7px 7px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}.history{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.empty{color:var(--muted);padding:15px 0}.toast{position:fixed;right:18px;bottom:18px;background:#263238;color:#fff;padding:13px 16px;border-radius:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}.surprise{background:#fff7df;border:1px dashed #f1c64c}.mini{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">🏃 运动冒险</div><div class="xp">⭐ <span id="xp">0</span> XP <span class="pill">🔥 <span id="streak">0</span> 天</span></div></div>
<div class="grid"><main>
<section class="card hero"><div class="eyebrow">今日任务</div><h1 id="heroTitle">今天动一动吧</h1><p id="heroText">完成一次运动，就能获得 XP。没有惩罚，只有继续前进。</p><div class="big"><span id="todayMinutes">0</span><small style="font-size:18px"> 分钟</small></div><button class="btn" style="margin-top:14px" onclick="focusForm()">＋ 记录今天的运动</button></section>
<section class="card section"><h2>记录运动</h2><div class="form" id="form"><label>日期<input id="date" type="date"></label><label>时长（分钟）<input id="minutes" type="number" min="1" placeholder="例如 20"></label><label class="full">做了什么？<input id="exercise" placeholder="例如：跟练瑜伽、散步、力量训练"></label><label class="full">Bilibili 视频链接（可选）<input id="video" type="url" placeholder="https://www.bilibili.com/..."></label><label class="full">今天的感受（可选）<textarea id="note" placeholder="完成了就是进步。随便写一句也可以。"></textarea></label></div><button class="btn" style="margin-top:12px" onclick="saveEntry()">完成并获得 XP ✨</button></section>
<section class="card section"><h2>📅 我的运动日历</h2><div class="calendar" id="calendar"></div></section>
</main><aside>
<section class="card"><h2 style="margin-top:0">🎁 今日惊喜</h2><div class="surprise" style="padding:14px"><b id="surpriseTitle">随机小任务</b><p id="surpriseText" class="mini">完成今天的运动后，点一下看看。</p><button class="btn secondary" onclick="surprise()">打开惊喜</button></div></section>
<section class="card section"><h2>🏅 成就</h2><div id="badges"></div></section>
<section class="card section"><h2>📊 统计</h2><div class="stats"><div class="stat"><b id="week">0</b><span>本周分钟</span></div><div class="stat"><b id="month">0</b><span>本月分钟</span></div><div class="stat"><b id="sessions">0</b><span>总次数</span></div></div><div class="section"><div class="mini">本月每日时长</div><div class="chart" id="chart"></div></div></section>
<section class="card section"><h2>📝 最近记录</h2><div id="history"></div></section>
</aside></div></div><div class="toast" id="toast"></div>
<script>
const KEY='exerciseDiaryV1';let data=JSON.parse(localStorage.getItem(KEY)||'{"entries":[],"xp":0}');
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
$('date').value=today();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function calcStreak(){let days=[...new Set(data.entries.map(e=>e.date))].sort().reverse();if(!days.length)return 0;let d=new Date();let t=today();if(days[0]!==t){let y=new Date();y.setDate(y.getDate()-1);if(days[0]!==y.toISOString().slice(0,10))return 0;d=y}let n=0;for(let x of days){let s=d.toISOString().slice(0,10);if(x!==s)break;n++;d.setDate(d.getDate()-1)}return n}
function total(date){return data.entries.filter(e=>e.date===date).reduce((a,e)=>a+e.minutes,0)}
function weekTotal(){let now=new Date(),day=(now.getDay()+6)%7,start=new Date(now);start.setDate(now.getDate()-day);return data.entries.filter(e=>new Date(e.date+'T00:00:00')>=start).reduce((a,e)=>a+e.minutes,0)}
function monthTotal(){let m=today().slice(0,7);return data.entries.filter(e=>e.date.startsWith(m)).reduce((a,e)=>a+e.minutes,0)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function focusForm(){$('minutes').focus();window.scrollTo({top:$('form').getBoundingClientRect().top+scrollY-20,behavior:'smooth'})}
function saveEntry(){let date=$('date').value,minutes=Number($('minutes').value),exercise=$('exercise').value.trim();if(!date||!minutes||minutes<1||!exercise){toast('把日期、时长和运动内容填好再出发～');return}let e={id:Date.now(),date,minutes,exercise,video:$('video').value.trim(),note:$('note').value.trim()};data.entries.push(e);let gain=Math.min(100,10+Math.round(minutes/5)*2);data.xp+=gain;save();$('minutes').value='';$('exercise').value='';$('video').value='';$('note').value='';render();toast(`完成！+${gain} XP ✨`)}
function renderCalendar(){let d=new Date(today()+'T00:00:00'),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay();let days=new Date(y,m+1,0).getDate();let html=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,mins=total(ds),cls=(mins?'done ':'')+(ds===today()?'today ':'')+(ds===($('date').value)?'selected':'');html+=`<button class="day ${cls}" onclick="selectDay('${ds}')"><b>${n}</b>${mins?`<small>🏃 ${mins}m</small>`:''}</button>`} $('calendar').innerHTML=html}
function selectDay(ds){$('date').value=ds;renderCalendar();let es=data.entries.filter(e=>e.date===ds);if(es.length)toast(`${ds}：${total(ds)} 分钟，${es.length} 次运动`)}
function renderBadges(){let s=calcStreak(),mins=data.entries.reduce((a,e)=>a+e.minutes,0),arr=[['🌱','第一次运动',data.entries.length>=1],['🔥','连续 3 天',s>=3],['⚡','累计 60 分钟',mins>=60],['🏆','累计 300 分钟',mins>=300],['🌟','累计 10 次',data.entries.length>=10]];$('badges').innerHTML=arr.map(x=>`<span class="badge ${x[2]?'on':''}">${x[0]} ${x[1]}${x[2]?' ✓':''}</span>`).join('')}
function renderChart(){let y=new Date().getFullYear(),m=new Date().getMonth(),days=new Date(y,m+1,0).getDate(),max=1;let vals=[];for(let i=1;i<=days;i++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,v=total(ds);vals.push(v);max=Math.max(max,v)}$('chart').innerHTML=vals.map((v,i)=>`<div class="bar" style="height:${Math.max(3,v/max*115)}px;opacity:${v?1:.12}"><span>${i+1}</span></div>`).join('')}
function renderHistory(){let es=[...data.entries].sort((a,b)=>b.id-a.id).slice(0,8);$('history').innerHTML=es.length?es.map(e=>`<div class="history"><div><b>${e.exercise}</b><div class="mini">${e.date} · ${e.minutes} 分钟${e.video?` · <a href="${e.video}" target="_blank" rel="noopener">视频</a>`:''}</div></div><b>+${Math.min(100,10+Math.round(e.minutes/5)*2)} XP</b></div>`).join(''):'<div class="empty">还没有记录。今天的第一格等你点亮。</div>'}
function surprise(){let a=[['🎲 幸运加成','今天的下一次运动额外 +10 XP。'],['🧘 温柔任务','只运动 5 分钟也算完成。先开始，不追求完美。'],['🚶 探索任务','换一个平时不走的路线，散步 10 分钟。'],['💧 补给任务','运动后喝水、拉伸 3 分钟，然后给自己一个 ✓。']];let x=a[Math.floor(Math.random()*a.length)];$('surpriseTitle').textContent=x[0];$('surpriseText').textContent=x[1]}
function render(){let st=calcStreak(),tm=total(today());$('xp').textContent=data.xp;$('streak').textContent=st;$('todayMinutes').textContent=tm;$('week').textContent=weekTotal();$('month').textContent=monthTotal();$('sessions').textContent=data.entries.length;$('heroTitle').textContent=tm?`今天已经动了 ${tm} 分钟！`:'今天动一动吧';$('heroText').textContent=tm?'很好，记录会留下来，接下来想停就停，想继续就继续。':'完成一次运动，就能获得 XP。没有惩罚，只有继续前进。';renderCalendar();renderBadges();renderChart();renderHistory()}
render();
</script></body></html>
